name: checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
env:
  # openwizdev/OpenWiz main at the merge of #981 (openwiz loop validate,
  # OpenWiz #790), whose pinned format is WizLoops c7c2ed4. A full commit,
  # never a branch: change it only to another merged OpenWiz commit.
  OPENWIZ_REV: ef63380829f2aa946c7dae867c85ea1ec21a61f9
  RUST_VERSION: 1.99.1
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
      - name: openwiz at ${{ env.OPENWIZ_REV }}
        run: |
          cargo install --locked --git https://github.com/openwizdev/OpenWiz --rev "$OPENWIZ_REV" --bin openwiz openwiz-cli
          openwiz loop validate --help > /dev/null
      - run: sh ci/check.sh
