name: checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
env:
  OPENWIZ_REV: ef63380829f2aa946c7dae867c85ea1ec21a61f9
  RUST_VERSION: 1.99.1
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: comment-check
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          sh ci/comment-check.sh HEAD^1
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
      - name: openwiz at ${{ env.OPENWIZ_REV }}
        run: |
          cargo install --locked --git https://github.com/openwizdev/OpenWiz --rev "$OPENWIZ_REV" --bin openwiz openwiz-cli
          openwiz loop validate --help > /dev/null
      - run: sh ci/check.sh
